# Шаблон nginx для NetBox (РЕД ОС 8)
# Скопировать в /etc/nginx/conf.d/netbox.conf
# Замените:
#   ALLOWED_CLIENT_IP  — IP, с которого разрешён доступ
#   NETBOX_IP / FQDN   — имя сервера
#   пути к сертификатам при необходимости

upstream netbox {
    server 127.0.0.1:8001 fail_timeout=0;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 10.0.130.10;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name 10.0.130.10;

    ssl_certificate     /etc/pki/tls/certs/netbox.crt;
    ssl_certificate_key /etc/pki/tls/private/netbox.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 25m;

    # HTTPS только с указанного IP (+ localhost для диагностики)
    allow ALLOWED_CLIENT_IP;
    allow 127.0.0.1;
    deny all;

    location /static/ {
        alias /opt/netbox/netbox/static/;
    }

    location / {
        proxy_pass http://netbox;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
    }
}

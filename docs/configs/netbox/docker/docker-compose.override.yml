# Шаблон override для /opt/netbox-docker
# Порт только на localhost — наружу смотрит nginx на хосте (HTTPS).
# Замените SUPERUSER_* перед запуском (или доверьте скрипту установки).

services:
  netbox:
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SKIP_SUPERUSER: "false"
      SUPERUSER_NAME: "admin"
      SUPERUSER_EMAIL: "admin@example.local"
      SUPERUSER_PASSWORD: "CHANGE_ME"

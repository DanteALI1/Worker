# Необязательный фрагмент: отдельный VirtualHost только для репозитория.
# Обычно достаточно DocumentRoot по умолчанию /var/www/html — путь /repos/... уже доступен.
#
# Установка: скопировать в /etc/httpd/conf.d/local-repo.conf и:
#   systemctl reload httpd

<Directory "/var/www/html/repos">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require ip 10.0.0.0/8
</Directory>

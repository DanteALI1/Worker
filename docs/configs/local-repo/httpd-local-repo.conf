# Необязательный фрагмент: ограничить доступ к репозиторию сетью 10.0.0.0/8.
# Обычно DocumentRoot /var/www/html уже отдаёт /repos/... через symlink на /opt/repos.
#
# Установка:
#   cp httpd-local-repo.conf /etc/httpd/conf.d/local-repo.conf
#   # при другой сети: sed -i 's|10.0.0.0/8|10.0.0.0/24|g' /etc/httpd/conf.d/local-repo.conf
#   apachectl configtest && systemctl reload httpd

# FollowSymLinks обязателен: /var/www/html/repos → /opt/repos
<Directory "/var/www/html">
    Options Indexes FollowSymLinks
    AllowOverride None
</Directory>

<Directory "/var/www/html/repos">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require ip 10.0.0.0/8
</Directory>

# Реальный каталог на разделе /opt
<Directory "/opt/repos">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require ip 10.0.0.0/8
</Directory>

# Архив старых пакетов на /var
Alias /archive /var/local-repo-archive
<Directory "/var/local-repo-archive">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require ip 10.0.0.0/8
</Directory>

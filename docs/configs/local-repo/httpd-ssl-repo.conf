# HTTPS VirtualHost для локального репозитория РЕД ОС 8
# Основано на:
#   https://redos.red-soft.ru/base/redos-8_0/8_0-administation/8_0-repo/8_0-create-repo-https/
#   https://redos.red-soft.ru/base/redos-8_0/8_0-security/8_0-ssl/8_0-ssl-for-webserv/
#
# Требуется: dnf install mod_ssl
# Установка:
#   1) положить сертификаты (см. install-ssl-certs.sh)
#   2) sed -i 's/repo.example.ru/ВАШ_FQDN/g' этот файл
#   3) cp в /etc/httpd/conf.d/ssl-repo.conf
#   4) apachectl configtest && systemctl restart httpd
#
# Если используете штатный /etc/httpd/conf.d/ssl.conf — задайте те же
# ServerName / SSLCertificateFile / SSLCertificateKeyFile там.
# Этот файл можно использовать вместо правки ssl.conf (отключите
# конфликтный default SSL vhost при необходимости).

# Listen 443 уже задаёт пакет mod_ssl (/etc/httpd/conf.d/ssl.conf).
# Не дублируйте Listen здесь.

# Если конфликт с default SSL vhost из ssl.conf — закомментируйте там
# весь <VirtualHost _default_:443> или отключите ssl.conf и оставьте только этот файл.

<VirtualHost _default_:443>
    ServerName repo.example.ru
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile /etc/pki/tls/certs/repo.crt
    SSLCertificateKeyFile /etc/pki/tls/private/repo.key
    # Раскомментируйте, если УЦ выдал промежуточную цепочку:
    # SSLCertificateChainFile /etc/pki/tls/certs/repo-chain.crt

    ErrorLog logs/ssl-repo-error_log
    CustomLog logs/ssl-repo-access_log combined

    <Directory "/var/www/html">
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Репозиторий: /var/www/html/repos → /opt/repos
    <Directory "/var/www/html/repos">
        Options Indexes FollowSymLinks
        AllowOverride None
        Require ip 10.0.0.0/8
    </Directory>

    <Directory "/opt/repos">
        Options Indexes FollowSymLinks
        AllowOverride None
        Require ip 10.0.0.0/8
    </Directory>

    # Архив старых RPM на /var (см. sync-redos8-repos.sh ARCHIVE=1)
    Alias /archive /var/local-repo-archive
    <Directory "/var/local-repo-archive">
        Options Indexes FollowSymLinks
        AllowOverride None
        Require ip 10.0.0.0/8
    </Directory>
</VirtualHost>
